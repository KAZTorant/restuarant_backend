[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway runs this instead of the image ENTRYPOINT. tini must be the process
# Railway starts, otherwise Chromium children are never reaped.
startCommand = "/usr/bin/tini -g -- /usr/local/bin/node server.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
