{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block content_title %}
<h1>
  {{ cl.opts.verbose_name_plural|capfirst }}
  <a href="{{ calculate_url }}" class="addlink" style="margin-left: 20px;">
    {% trans "Yeni hesablama yarat" %}
  </a>
</h1>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
  .addlink {
    background: #417690;
    color: white !important;
    padding: 8px 15px;
    text-decoration: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: normal;
  }

  .addlink:hover {
    background: #205067;
    color: white !important;
  }

  .addlink:before {
    content: "🧮 ";
    margin-right: 5px;
  }
</style>
{% endblock %}
