{% extends "admin/change_list.html" %}
{% load i18n admin_urls static %}

{% block content_title %}
<h1>{{ title }}</h1>

<!-- Date Range Calculator -->
<div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #dee2e6;">
    <h3 style="margin-top: 0; color: #495057;">
        <span style="font-size: 1.2em;">💰</span> Tarix aralığına görə ümumi çıxarılmış məbləğ
    </h3>
    <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
        <div>
            <label for="start_date" style="display: block; font-weight: bold; margin-bottom: 5px; color: #495057;">
                Başlanğıc tarixi:
            </label>
            <input type="date" 
                   id="start_date" 
                   name="start_date" 
                   style="padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px;">
        </div>
        <div>
            <label for="end_date" style="display: block; font-weight: bold; margin-bottom: 5px; color: #495057;">
                Bitmə tarixi:
            </label>
            <input type="date" 
                   id="end_date" 
                   name="end_date" 
                   style="padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px;">
        </div>
        <div>
            <button type="button" 
                    id="calculate_btn" 
                    style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">
                📊 Hesabla
            </button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calculateBtn = document.getElementById('calculate_btn');
    const startDateInput = document.getElementById('start_date');
    const endDateInput = document.getElementById('end_date');
    
    // Set default dates (last 7 days)
    const today = new Date();
    const lastWeek = new Date(today);
    lastWeek.setDate(today.getDate() - 7);
    
    endDateInput.value = today.toISOString().split('T')[0];
    startDateInput.value = lastWeek.toISOString().split('T')[0];
    
    calculateBtn.addEventListener('click', function() {
        const startDate = startDateInput.value;
        const endDate = endDateInput.value;
        
        if (!startDate || !endDate) {
            alert('❌ Xəta: Zəhmət olmasa hər iki tarixi seçin!');
            return;
        }
        
        if (new Date(startDate) > new Date(endDate)) {
            alert('❌ Xəta: Başlanğıc tarixi bitmə tarixindən sonra ola bilməz!');
            return;
        }
        
        // Show loading state
        calculateBtn.disabled = true;
        calculateBtn.innerHTML = '⏳ Hesablanır...';
        
        // Make AJAX request
        fetch(`calculate-total/?start_date=${startDate}&end_date=${endDate}`)
            .then(response => response.json())
            .then(data => {
                calculateBtn.disabled = false;
                calculateBtn.innerHTML = '📊 Hesabla';
                
                if (data.success) {
                    const message = `
╔════════════════════════════════════════╗
║   💰 ÇİXARILMIŞ MƏBLƏĞ HESABATI   ║
╠════════════════════════════════════════╣
║                                        ║
║  📅 Tarix aralığı:                     ║
║     ${data.start_date} - ${data.end_date}     ║
║                                        ║
║  📊 Növbələrin sayı: ${data.count}              ║
║                                        ║
║  💵 Ümumi nağd: ${data.total_cash} AZN         ║
║                                        ║
║  🔴 Çıxarılmış məbləğ: ${data.total_withdrawn} AZN  ║
║                                        ║
║  🟢 Qalan nağd: ${data.total_remaining} AZN       ║
║                                        ║
╚════════════════════════════════════════╝
                    `;
                    alert(message);
                } else {
                    alert('❌ Xəta: ' + data.error);
                }
            })
            .catch(error => {
                calculateBtn.disabled = false;
                calculateBtn.innerHTML = '📊 Hesabla';
                alert('❌ Xəta baş verdi: ' + error);
            });
    });
    
    // Hover effect
    calculateBtn.addEventListener('mouseenter', function() {
        this.style.backgroundColor = '#218838';
    });
    
    calculateBtn.addEventListener('mouseleave', function() {
        if (!this.disabled) {
            this.style.backgroundColor = '#28a745';
        }
    });
});
</script>
{% endblock %}
