[build]
builder = "nixpacks"

[deploy]
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_superuser && python manage.py ensure_qonaq_baku"
startCommand = "bash bin/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
