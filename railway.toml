[build]
builder = "nixpacks"

[deploy]
preDeployCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_superuser && python manage.py restore_dump_timestamps --restaurant qonaq-baku --data-path data/qonaq_baku.json.gz"
startCommand = "bash bin/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
