[build]
builder = "nixpacks"

[deploy]
preDeployCommand = "bash bin/build-admin-frontend.sh && python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_superuser"
startCommand = "bash bin/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
